[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosh"
version = "0.1.0"
description = "Kosh - AI Finance Controller: three-way payment settlement reconciliation with verifiable ground truth"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
]

# pydantic/fastapi/uvicorn were dropped here (hardening sprint Task 6.4): zero
# imports of any of the three exist anywhere in this codebase - dead weight
# left over from the original brief's suggested stack, never actually wired
# up to anything.
[project.optional-dependencies]
dev = ["pytest==9.1.1"]
llm = ["anthropic==0.82.0", "openai==2.53.0"]

[tool.setuptools]
packages = ["data", "data.generator", "engine", "eval", "cash", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
