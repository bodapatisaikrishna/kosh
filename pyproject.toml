[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kosh"
version = "0.1.0"
description = "Kosh - AI Finance Controller: three-way payment settlement reconciliation with verifiable ground truth"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["data", "data.generator", "engine", "eval", "cash", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
